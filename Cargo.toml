[package]
name = "airplay-receiver"
version = "1.0.0"
edition = "2024"
description = "Turn a Windows PC into an AirPlay speaker, with track info, remote control and an output picker."
license = "GPL-3.0-only"
repository = "https://github.com/spongebobmoviept-lab/AirPlayReceiver"

[[bin]]
name = "AirPlayReceiver"
path = "src/main.rs"

[dependencies]
shairplay = { path = "vendor/shairplay" }
tokio = { version = "1", features = ["rt-multi-thread"] }
cpal = "0.18"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_Media_Audio_Endpoints", "Win32_Security", "Win32_System_Com_StructuredStorage", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "smallvec"] }
raw-window-handle = "0.6"
tray-icon = "0.26.1"
windows-registry = "0.100.0"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
